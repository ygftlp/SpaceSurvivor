<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Radar System Preview</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .radar-card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .radar-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border-color: #666;
        }
        canvas {
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .info {
            width: 100%;
            text-align: left;
        }
        .name {
            font-weight: bold;
            font-size: 1.1em;
            color: #fff;
            margin-bottom: 5px;
        }
        .stats {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 5px;
        }
        .desc {
            font-size: 0.8em;
            color: #888;
            font-style: italic;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding: 2px 0;
        }
        .stat-label { color: #888; }
        .stat-value { color: #ccc; }
    </style>
</head>
<body>

    <h1>Player Radar System - Component Preview</h1>
    
    <div class="grid-container" id="radarGrid">
        <!-- Radar cards will be injected here -->
    </div>

    <script src="PlayerRadarSystem.js"></script>
    <script>
        const radarSystem = new PlayerRadarSystem();
        const grid = document.getElementById('radarGrid');
        
        // List of all radar types
        const radarTypes = Object.keys(radarSystem.types);
        
        // Store radar instances for animation
        const radars = [];

        radarTypes.forEach(type => {
            const radar = radarSystem.create(type);
            radars.push(radar);

            // Create Card
            const card = document.createElement('div');
            card.className = 'radar-card';

            // Create Canvas
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            radar.canvas = canvas;
            radar.ctx = canvas.getContext('2d');
            card.appendChild(canvas);

            // Info Section
            const info = document.createElement('div');
            info.className = 'info';
            
            info.innerHTML = `
                <div class="name" style="color: ${radar.color}">${radar.name}</div>
                <div class="stats">
                    <div class="stat-row"><span class="stat-label">Range:</span> <span class="stat-value">${radar.range}</span></div>
                    <div class="stat-row"><span class="stat-label">Scan Speed:</span> <span class="stat-value">${radar.scanSpeed}</span></div>
                    <div class="stat-row"><span class="stat-label">Type:</span> <span class="stat-value">${type}</span></div>
                </div>
                <div class="desc">${radar.description}</div>
            `;
            card.appendChild(info);

            grid.appendChild(card);
        });

        // Animation Loop
        function animate() {
            radars.forEach(radar => {
                // Update state
                radar.update();

                // Clear canvas
                const ctx = radar.ctx;
                const width = radar.canvas.width;
                const height = radar.canvas.height;
                
                ctx.clearRect(0, 0, width, height);

                // Draw Grid Background
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let i=0; i<=width; i+=20) { ctx.moveTo(i,0); ctx.lineTo(i,height); }
                for(let i=0; i<=height; i+=20) { ctx.moveTo(0,i); ctx.lineTo(width,i); }
                ctx.stroke();

                // Render Radar
                // Center is (100, 100), Scale 2x for visibility
                radar.render(ctx, width/2, height/2, 2.5);
            });

            requestAnimationFrame(animate);
        }

        animate();

    </script>
</body>
</html>
